<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <link rel="stylesheet" href="custom.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Yto-lukkarit</title>
</head>
<body>
  <header>
    <h1>YTO-lukkarit</h1>
  </header>
  <main>
    <p>
      Tervetuloa! Täältä näet lukujärjestykset Järvenpään ytoloihin.
    </p>
    <div id="valinta_container">
        <select name="lukkarivalinta" id="lukkarivalinta">
            <option value="">Valitse Ytola:</option>
            <option value="hikalao">Hika + Lao</option>
            <option value="sote">Sote</option>
            <option value="sote_lessons">Sote (oppitunnit)</option>
            <option value="nyo">Nyo</option>
        </select>
    </div>
    <p>
      Jos tahdot oman muistilistan puhelimeen suoritetuista ytoista, käy katsomassa <a href="https://jarimus.github.io/ytoapp">YTO-app ytojen seurantaan</a>.
    </p>
  </main>

  <footer>
    <p>Tekijä: Jari Ahonen</p>
  </footer>
</body>
</html>
<script src="index.js"></script>
